services:
  bazar-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bazar-sentinel
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"