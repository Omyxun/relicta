{% if oob %}
<div hx-swap-oob="beforeend:#toast-container">
{% endif %}
    <div onclick="this.remove()"
         class="pointer-events-auto cursor-pointer rounded-lg px-4 py-3 shadow-2xl border text-xs font-medium flex items-center justify-between gap-3 transition
                {% if level == 'error' %}bg-[#121215] border-rose-500/40 text-rose-300
                {% elif level == 'info' %}bg-[#121215] border-white/[0.15] text-zinc-200
                {% else %}bg-[#121215] border-emerald-500/40 text-emerald-300{% endif %}">
        <span>{{ message }}</span>
        <span class="text-zinc-500 hover:text-zinc-300">&times;</span>
        <script>
            (function(el) {
                setTimeout(() => { if (el && el.parentNode) el.remove(); }, 4500);
            })(document.currentScript.parentElement);
        </script>
    </div>
{% if oob %}
</div>
{% endif %}
