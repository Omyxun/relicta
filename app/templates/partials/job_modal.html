<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="bg-[#121215] border border-white/[0.1] rounded-xl shadow-2xl overflow-hidden max-w-2xl w-full p-6 my-8">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-white/[0.08] pb-4 mb-5">
            <h2 class="text-base font-semibold text-zinc-100 tracking-tight">
                {% if job %}Edit Search Job — {{ job.name }}{% else %}Create New Search Job{% endif %}
            </h2>
            <button type="button"
                    onclick="document.getElementById('modal-container').innerHTML = ''"
                    class="text-zinc-400 hover:text-white p-1 rounded-md hover:bg-white/[0.05] transition">
                <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4l8 8M12 4l-8 8" />
                </svg>
            </button>
        </div>

        {% if error %}
        <div class="mb-4 rounded-lg bg-rose-500/10 border border-rose-500/20 px-4 py-3 text-xs text-rose-300 font-mono">
            {{ error }}
        </div>
        {% endif %}

        <form hx-post="{% if job %}/jobs/{{ job.id }}{% else %}/jobs{% endif %}"
              hx-target="#modal-container"
              hx-swap="innerHTML"
              class="space-y-4">

            <!-- Name and Interval -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Job Name</label>
                    <input type="text" name="name" required
                           value="{{ job.name if job else '' }}"
                           placeholder="e.g., ThinkPad T14 / MacBook 14 Deals"
                           class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition shadow-inner" />
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Poll Interval (seconds)</label>
                    <input type="number" name="poll_interval_seconds" min="60" step="30" required
                           value="{{ job.poll_interval_seconds if job else 300 }}"
                           class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition shadow-inner" />
                </div>
            </div>

            <p class="text-[11px] text-zinc-500">First scan starts as soon as the worker is free. The interval applies to repeat scans.</p>

            <!-- Target Marketplaces (Pill checkboxes) -->
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5">Target Marketplaces</label>
                <div class="flex flex-wrap gap-2">
                    {% for p in available_platforms %}
                    <label class="relative inline-flex items-center">
                        <input type="checkbox" name="platforms" value="{{ p }}"
                               {% if (job and p in job.platforms) or (not job and p in ['bazos', 'sbazar', 'ebay']) %}checked{% endif %}
                               class="sr-only peer" />
                        <span class="peer-checked:bg-zinc-100 peer-checked:text-zinc-950 peer-checked:border-zinc-100 bg-zinc-950/80 border border-white/[0.08] text-zinc-400 font-mono text-xs px-3 py-1.5 rounded-md cursor-pointer transition select-none uppercase font-semibold">
                            {{ p }}
                        </span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Search Queries -->
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5">
                    Search Queries (one per line or comma-separated)
                </label>
                <textarea name="search_queries_raw" rows="2" required
                          placeholder="thinkpad t14, notebook 14, elitebook 845"
                          class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition shadow-inner">{{ job.search_queries | join(', ') if job else '' }}</textarea>
            </div>

            <!-- Budget Row -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">
                        Min Price Floor ({{ current_user.base_currency }})
                    </label>
                    <input type="number" name="min_price" step="1" min="0" required
                           value="{{ job.min_price if job else 500 }}"
                           class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 transition shadow-inner" />
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">
                        Max Total Budget ({{ current_user.base_currency }})
                    </label>
                    <input type="number" name="max_price" step="1" min="1" required
                           value="{{ job.max_price if job else 12000 }}"
                           class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 transition shadow-inner" />
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">
                        Shipping Buffer ({{ current_user.base_currency }})
                    </label>
                    <input type="number" name="shipping_buffer" step="1" min="0" required
                           value="{{ job.shipping_buffer if job else 85 }}"
                           class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 transition shadow-inner" />
                </div>
            </div>

            <!-- Toggles (Dohodou & Shipping) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                <!-- Allow Dohodou -->
                <label class="relative flex items-start justify-between gap-3 p-3 rounded-lg bg-zinc-950/80 border border-white/[0.08] hover:border-white/[0.15] cursor-pointer transition has-[:checked]:border-zinc-400 has-[:checked]:bg-white/[0.04]">
                    <div class="text-xs pr-2">
                        <div class="font-medium text-zinc-200">Allow "Dohodou" / Unpriced Ads</div>
                        <div class="text-zinc-500 mt-0.5">Requires strict keyword match; grouped separately at bottom of digests.</div>
                    </div>
                    <div class="relative shrink-0 mt-0.5">
                        <input type="checkbox" name="allow_unpriced" value="1"
                               {% if job and job.allow_unpriced %}checked{% endif %}
                               class="sr-only peer" />
                        <div class="w-9 h-5 bg-zinc-800 peer-checked:bg-emerald-500 rounded-full transition-colors border border-white/[0.1]"></div>
                        <div class="w-4 h-4 bg-white rounded-full transition-transform absolute left-0.5 top-0.5 peer-checked:translate-x-4 pointer-events-none shadow-sm"></div>
                    </div>
                </label>

                <!-- Exclude pickup-only listings -->
                <label class="relative flex items-start justify-between gap-3 p-3 rounded-lg bg-zinc-950/80 border border-white/[0.08] hover:border-white/[0.15] cursor-pointer transition has-[:checked]:border-zinc-400 has-[:checked]:bg-white/[0.04]">
                    <div class="text-xs pr-2">
                        <div class="font-medium text-zinc-200">Exclude pickup-only listings</div>
                        <div class="text-zinc-500 mt-0.5">Discards ads containing "pouze osobní", "neposílám", etc.</div>
                    </div>
                    <div class="relative shrink-0 mt-0.5">
                        <input type="checkbox" name="require_shipping" value="1"
                               {% if job and job.require_shipping %}checked{% endif %}
                               class="sr-only peer" />
                        <div class="w-9 h-5 bg-zinc-800 peer-checked:bg-emerald-500 rounded-full transition-colors border border-white/[0.1]"></div>
                        <div class="w-4 h-4 bg-white rounded-full transition-transform absolute left-0.5 top-0.5 peer-checked:translate-x-4 pointer-events-none shadow-sm"></div>
                    </div>
                </label>
            </div>

            <!-- Required Keywords -->
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5">
                    Required Keywords (comma-separated AND groups, pipe <code class="font-mono text-zinc-300">|</code> for OR)
                </label>
                <input type="text" name="required_keywords"
                       value="{{ job.required_keywords if job else '' }}"
                       placeholder="e.g., 16gb|32gb, ssd|nvme, oled|ips"
                       class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-sm text-zinc-100 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition shadow-inner" />
            </div>

            <!-- Excluded Keywords -->
            <div>
                <label class="block text-xs font-medium text-zinc-400 mb-1.5">
                    Excluded Keywords (per-job blacklist)
                </label>
                <textarea name="excluded_keywords" rows="2"
                          class="w-full bg-zinc-950/90 border border-white/[0.08] rounded-md px-3 py-2 text-xs text-zinc-200 font-mono placeholder:text-zinc-600 focus:outline-none focus:border-zinc-400 transition shadow-inner">{{ job.excluded_keywords if job else default_excluded }}</textarea>
            </div>

            <!-- Footer Buttons -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/[0.08]">
                <button type="button"
                        onclick="document.getElementById('modal-container').innerHTML = ''"
                        class="text-xs font-medium text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.05] px-3.5 py-2 rounded-md transition">
                    Cancel
                </button>
                <button type="submit"
                        class="bg-zinc-100 text-zinc-950 hover:bg-white font-medium text-xs px-4 py-2 rounded-md shadow-sm transition">
                    {% if job %}Save Changes{% else %}Create Search Job{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
